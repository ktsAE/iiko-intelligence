[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iiko-intelligence-trial"
version = "0.4.1"
description = "Read-only iiko reporting for one restaurant manager"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "defusedxml==0.7.1",
  "mcp==2.3.0",
  "openpyxl==3.1.5",
  "pydantic>=2,<3",
  "xlrd==2.0.2",
  "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
iiko-intelligence = "iiko_intelligence.cli:main"
iiko-intelligence-mcp = "iiko_intelligence.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iiko_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.iiko]
update_layout = 1
