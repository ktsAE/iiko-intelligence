name: Verify published Windows installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Optional signed draft tag to test before publication
        required: false
        type: string

permissions:
  contents: read

jobs:
  draft_assets:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub restricts draft release listings to callers with push access.
    # This job only transfers files. It never checks out or runs the project.
    permissions:
      contents: write
    steps:
      - name: Download the three signed installation files
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          [[ "$DRAFT_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --dir signed-kit \
            --pattern 'Install-iiko.ps1' --pattern 'iiko-intelligence-windows-x64.zip' --pattern 'iiko-intelligence-windows-x64.zip.sig'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-kit
          path: signed-kit/*
          if-no-files-found: error
          retention-days: 1

  install:
    needs: draft_assets
    if: ${{ !cancelled() && (needs.draft_assets.result == 'success' || needs.draft_assets.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.draft_tag != ''
        with:
          name: signed-kit
          path: ${{ runner.temp }}/signed-kit
      - name: Install the signed release and verify a repeat setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Join-Path $env:RUNNER_TEMP 'Manager reports #1'
          New-Item -ItemType Directory -Path $parent | Out-Null
          $options = @{ ParentDirectory = $parent }
          $installer = '.\Install-iiko.ps1'
          $kit = Join-Path $env:RUNNER_TEMP 'signed-kit'
          if (Test-Path -LiteralPath $kit) {
            $options['PackageDirectory'] = $kit
            $installer = Join-Path $kit 'Install-iiko.ps1'
            $downloaded = (Get-Content -LiteralPath $installer -Raw).Replace("`r`n", "`n")
            $trusted = (Get-Content -LiteralPath .\Install-iiko.ps1 -Raw).Replace("`r`n", "`n")
            if ($downloaded -cne $trusted) { throw 'Installer differs from checked-out source.' }
          }
          & $installer @options
          $app = Join-Path $parent 'iiko-intelligence'
          $db = Join-Path $app 'data\manager.sqlite'
          $before = (Get-FileHash -LiteralPath $db).Hash
          & $installer @options
          if ((Get-FileHash -LiteralPath $db).Hash -ne $before) { throw 'Repeat setup changed the dataset.' }
          $result = & "$app\runtime\python.exe" -m iiko_intelligence.cli check-mcp
          if ($LASTEXITCODE -ne 0) { throw 'MCP verification failed.' }
          $status = ($result -join [Environment]::NewLine) | ConvertFrom-Json
          if ($status.dataset_mode -ne 'synthetic' -or @($status.tools).Count -ne 19) { throw 'Unexpected MCP status.' }
          & "$app\runtime\python.exe" -m unittest discover -s "$env:GITHUB_WORKSPACE\tests" -p test_live_sales.py
          if ($LASTEXITCODE -ne 0) { throw 'Live reporting fixture tests failed in the installed runtime.' }
          Write-Output 'Windows install, repeat setup, 19 read-only tools and live reporting fixtures verified.'
